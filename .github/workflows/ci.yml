name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run tests
        run: npm test
      - name: Self-scan bad fixture (expect findings)
        run: |
          set +e
          node bin/mcpguard.js scan test/fixtures/bad-config.json --quiet
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "Expected exit code 1 for bad fixture, got $code"
            exit 1
          fi
          echo "Confirmed expected findings exit code 1"
      - name: Self-scan good fixture (expect clean)
        run: node bin/mcpguard.js scan test/fixtures/good-config.json --quiet
